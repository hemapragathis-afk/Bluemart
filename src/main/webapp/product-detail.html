<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlueMart - Product Detail</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .product-card img {
            max-width: 200px;
            border-radius: 4px;
        }
        .product-card h2 {
            margin: 10px 0 5px;
        }
        .product-card .price {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
        }
        .product-card button {
            margin-top: 10px;
            padding: 10px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .avg-rating {
            font-size: 18px;
            color: #ffc107;
            margin: 10px 0;
        }
        .review-form {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .review-form select, .review-form textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .review-form button {
            padding: 8px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .review-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 15px;
            margin-bottom: 10px;
        }
        .review-card .stars {
            color: #ffc107;
            font-size: 16px;
        }
        .review-card .meta {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        #status {
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
        }
        .error { color: red; }
        .success { color: green; }
        a.back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="productInfo" class="product-card">Loading...</div>
        <div id="status"></div>

        <div class="review-form">
            <h3>Leave a Review</h3>
            <select id="ratingSelect">
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="1">★☆☆☆☆ (1)</option>
            </select>
            <textarea id="commentInput" rows="3" placeholder="Share your thoughts..."></textarea>
            <button onclick="submitReview()">Submit Review</button>
        </div>

        <h3>Reviews</h3>
        <div id="reviewList"></div>

        <a href="products.html" class="back-link">Back to Products</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');

        async function loadProduct() {
            const info = document.getElementById('productInfo');
            try {
                const response = await fetch('/bluemart/api/v1/products');
                const result = await response.json();
                const product = result.data.find(p => p.id == productId);

                if (!product) {
                    info.innerHTML = 'Product not found.';
                    return;
                }

                info.innerHTML = `
                    <img src="${product.imageUrl}" alt="${product.name}">
                    <h2>${product.name}</h2>
                    <p>${product.description}</p>
                    <div class="price">₹${product.price}</div>
                    <p>Stock: ${product.stockQty}</p>
                    <button onclick="addToCart()">Add to Cart</button>
                `;
            } catch (err) {
                info.innerHTML = 'Failed to load product.';
            }
        }

        async function addToCart() {
            const status = document.getElementById('status');
            try {
                const response = await fetch('/bluemart/api/v1/cart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId: parseInt(productId), quantity: 1 })
                });
                const result = await response.json();
                if (result.success) {
                    status.textContent = 'Added to cart!';
                    status.className = 'success';
                } else if (response.status === 401) {
                    status.textContent = 'Please log in first.';
                    status.className = 'error';
                } else {
                    status.textContent = 'Failed: ' + result.error;
                    status.className = 'error';
                }
            } catch (err) {
                status.textContent = 'Something went wrong.';
                status.className = 'error';
            }
        }

        function starString(rating) {
            return '★'.repeat(rating) + '☆'.repeat(5 - rating);
        }

        async function loadReviews() {
            const list = document.getElementById('reviewList');
            list.innerHTML = 'Loading reviews...';
            try {
                const response = await fetch('/bluemart/api/v1/reviews?productId=' + productId);
                const result = await response.json();

                if (!result.success) {
                    list.innerHTML = '<p>Could not load reviews.</p>';
                    return;
                }

                if (result.data.length === 0) {
                    list.innerHTML = '<p style="text-align:center;">No reviews yet. Be the first!</p>';
                    return;
                }

                const avg = result.data.reduce((sum, r) => sum + r.rating, 0) / result.data.length;
                const info = document.getElementById('productInfo');
                const avgDiv = document.createElement('div');
                avgDiv.className = 'avg-rating';
                avgDiv.textContent = starString(Math.round(avg)) + ' (' + avg.toFixed(1) + ' avg, ' + result.data.length + ' review' + (result.data.length === 1 ? '' : 's') + ')';
                info.appendChild(avgDiv);

                list.innerHTML = result.data.map(r => `
                    <div class="review-card">
                        <div class="stars">${starString(r.rating)}</div>
                        <p>${r.comment || ''}</p>
                        <div class="meta">${r.userName} · ${new Date(r.createdAt).toLocaleDateString()}</div>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = '<p>Something went wrong loading reviews.</p>';
            }
        }

        async function submitReview() {
            const status = document.getElementById('status');
            const rating = parseInt(document.getElementById('ratingSelect').value);
            const comment = document.getElementById('commentInput').value;

            try {
                const response = await fetch('/bluemart/api/v1/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId: parseInt(productId), rating: rating, comment: comment })
                });
                const result = await response.json();

                if (result.success) {
                    status.textContent = 'Review submitted!';
                    status.className = 'success';
                    document.getElementById('commentInput').value = '';
                    loadReviews();
                } else if (response.status === 401) {
                    status.textContent = 'Please log in first.';
                    status.className = 'error';
                } else {
                    status.textContent = 'Failed: ' + result.error;
                    status.className = 'error';
                }
            } catch (err) {
                status.textContent = 'Something went wrong.';
                status.className = 'error';
            }
        }

        loadProduct().then(loadReviews);
    </script>
    <script src="chat-widget.js"></script>
</body>
</html>
