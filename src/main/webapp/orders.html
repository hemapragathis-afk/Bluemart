<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlueMart - Order History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .toggle-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .toggle-bar button {
            padding: 8px 20px;
            border: 1px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 4px;
            cursor: pointer;
        }
        .toggle-bar button.active {
            background: #007bff;
            color: white;
        }
        .order-container {
            max-width: 650px;
            margin: 0 auto;
        }
        .order-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 15px;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .order-header h3 {
            margin: 0;
            font-size: 16px;
        }
        .status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .status.PENDING { background: #ffc107; color: #333; }
        .status.CONFIRMED { background: #17a2b8; }
        .status.SHIPPED { background: #007bff; }
        .status.DELIVERED { background: #28a745; }
        .status.CANCELLED { background: #dc3545; }
        .order-item-line {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #555;
            margin: 4px 0;
        }
        .order-total {
            text-align: right;
            font-weight: bold;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .order-date {
            font-size: 12px;
            color: #999;
        }
        #status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .error { color: red; }
        a.back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
        }
    </style>
</head>
<body>
    <h2>Order History</h2>

    <div class="toggle-bar">
        <button id="buyerBtn" class="active" onclick="switchView('buyer')">My Orders</button>
        <button id="sellerBtn" onclick="switchView('seller')">Orders I'm Fulfilling</button>
    </div>

    <div class="order-container">
        <div id="orderList"></div>
        <div id="status-msg"></div>
        <a href="products.html" class="back-link">Continue Shopping</a>
    </div>

    <script>
        let currentView = 'buyer';

        function switchView(view) {
            currentView = view;
            document.getElementById('buyerBtn').className = view === 'buyer' ? 'active' : '';
            document.getElementById('sellerBtn').className = view === 'seller' ? 'active' : '';
            loadOrders();
        }

        async function loadOrders() {
            const container = document.getElementById('orderList');
            const statusMsg = document.getElementById('status-msg');
            container.innerHTML = 'Loading...';
            statusMsg.textContent = '';

            try {
                const url = currentView === 'seller'
                    ? '/bluemart/api/v1/orders?view=seller'
                    : '/bluemart/api/v1/orders';
                const response = await fetch(url);
                const result = await response.json();

                if (response.status === 401) {
                    container.innerHTML = '';
                    statusMsg.textContent = 'Please log in first.';
                    statusMsg.className = 'error';
                    return;
                }

                if (!result.success) {
                    container.innerHTML = '';
                    statusMsg.textContent = 'Failed to load orders: ' + result.error;
                    statusMsg.className = 'error';
                    return;
                }

                if (result.data.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">No orders found.</p>';
                    return;
                }

                container.innerHTML = result.data.map(order => `
                    <div class="order-card">
                        <div class="order-header">
                            <h3>Order #${order.id}</h3>
                            <span class="status ${order.status}">${order.status}</span>
                        </div>
                        <div class="order-date">${new Date(order.createdAt).toLocaleString()}</div>
                        ${(order.items || []).map(item => `
                            <div class="order-item-line">
                                <span>${item.productName} x${item.quantity}</span>
                                <span>₹${(item.unitPrice * item.quantity).toFixed(2)}</span>
                            </div>
                        `).join('')}
                        <div class="order-total">Total: ₹${order.totalAmount}</div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '';
                statusMsg.textContent = 'Something went wrong loading orders.';
                statusMsg.className = 'error';
            }
        }

        loadOrders();
    </script>
</body>
</html>
