<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BlueMart</title>
<style>
  body { font-family: Arial, sans-serif; background:#14213D; margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  h1 { color:#FBFBF8; font-size:56px; margin-bottom:12px; }
  p { color:#C9D3DE; font-size:20px; margin-bottom:36px; }
  .btn-row { display:flex; gap:16px; }
  a.btn { text-decoration:none; padding:14px 32px; border-radius:30px; font-size:17px; font-weight:bold; }
  .primary { background:#2E6F95; color:#fff; }
  .secondary { background:transparent; color:#FBFBF8; border:2px solid #FBFBF8; }
</style>
</head>
<body>
  <h1>Welcome to BlueMart</h1>
  <p>Buy and sell products from sellers, all in one marketplace.</p>
  <div class="btn-row">
    <a class="btn primary" href="/bluemart/products.html">Browse products</a>
    <a class="btn secondary" href="/bluemart/login.html">Login</a>
    <a class="btn secondary" href="/bluemart/register.html">Register</a>
  </div>
</body>
</html>
